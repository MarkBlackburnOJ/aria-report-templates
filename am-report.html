<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16539F">
<title>Account Manager — Daily Report</title>
<style>
  :root{
    --blue:#16539F; --blue-deep:#0E3D75; --blue-tint:#E4ECF7;
    --red:#E31E24; --red-deep:#C2161B; --red-text:#A32D2D; --red-tint:#FCEBEB;
    --amber:#C98A1A; --amber-deep:#8A5A07; --amber-tint:#FBF1DC;
    --green:#1E8E3E; --green-deep:#157233; --green-text:#1B6E33; --green-tint:#E6F4EA;
    --ink:#1F2024; --mute:#6B7480; --mute-2:#8A929D;
    --paper:#F4F6F8; --card:#FFFFFF; --line:#E3E7EC; --line-soft:#ECEEF1; --shell:#EAECEF;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{background:var(--shell);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;}
  .wrap{max-width:1180px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,.05);}

  header{background:var(--blue);color:#fff;padding:20px 26px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  header .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.65);}
  header h1{font-size:23px;font-weight:700;margin:5px 0 0;letter-spacing:-.01em;}
  header .meta{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:5px;}
  .ibtn{border:0;background:rgba(255,255,255,.16);color:#fff;height:36px;padding:0 14px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;}

  .tabs{display:flex;gap:2px;padding:0 14px;background:var(--blue-deep);overflow-x:auto;}
  .tab{border:0;background:none;color:rgba(255,255,255,.72);font-family:inherit;font-size:13px;font-weight:600;padding:11px 13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  .tab.active{color:#fff;border-bottom-color:#fff;}

  .filterbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:var(--card);border-bottom:.5px solid var(--line);}
  .filterbar label{font-size:12px;color:var(--mute);font-weight:600;}
  .filterbar select{height:34px;border:.5px solid var(--line);border-radius:8px;background:var(--paper);font-family:inherit;font-size:13px;color:var(--ink);padding:0 8px;margin-left:6px;max-width:210px;}
  .filterbar .clear{font-size:12px;color:var(--blue);cursor:pointer;background:none;border:0;font-family:inherit;}
  .lens{font-size:12px;color:var(--mute-2);margin-left:auto;}

  /* multi-select filter — native <details> disclosure, no library */
  .ms{position:relative;}
  .ms>summary{list-style:none;cursor:pointer;height:34px;display:inline-flex;align-items:center;gap:5px;border:.5px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px;color:var(--ink);padding:0 10px;white-space:nowrap;max-width:230px;}
  .ms>summary::-webkit-details-marker{display:none;}
  .ms>summary::after{content:'\25BE';color:var(--mute-2);font-size:11px;margin-left:2px;}
  .ms[open]>summary::after{content:'\25B4';}
  .ms>summary .msl{color:var(--mute);font-weight:600;} .ms>summary .msv{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .ms[open]>summary{border-color:var(--blue);}
  .ms-pop{position:absolute;z-index:40;top:38px;left:0;min-width:220px;max-width:320px;max-height:300px;overflow:auto;background:var(--card);border:.5px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;}
  .ms-pop .msearch{width:100%;height:30px;border:.5px solid var(--line);border-radius:7px;padding:0 8px;font-family:inherit;font-size:13px;margin:2px 0 6px;}
  .ms-pop .ms-actions{display:flex;gap:14px;font-size:12px;padding:0 2px 6px;}
  .ms-pop .ms-actions a{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:600;}
  .ms-pop .ms-actions a:hover{text-decoration:underline;}
  .ms-pop label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--ink);}
  .ms-pop label:hover{background:var(--blue-tint);}
  .ms-pop input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);flex:none;}
  .ms-pop .msnone{color:var(--mute-2);font-size:12px;padding:6px 7px;}

  .pane{padding:18px 24px 40px;display:none;}
  .pane.active{display:block;}
  .h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 0 10px;}
  .h2:first-child{margin-top:2px;}
  .h2 .sub{font-weight:600;text-transform:none;letter-spacing:0;color:var(--mute-2);}

  details.writeup{background:var(--blue-tint);border-radius:12px;font-size:13px;line-height:1.6;color:var(--ink);}
  details.writeup>summary{padding:12px 18px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;}
  details.writeup>summary::-webkit-details-marker{display:none;}
  details.writeup>summary::before{content:'\25B8';color:var(--blue);font-size:12px;}
  details.writeup[open]>summary::before{content:'\25BE';}
  .writeup-body{padding:0 18px 14px;}
  .writeup b{font-weight:700;} .writeup .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin:0 2px;}
  .note{background:var(--amber-tint);border:.5px solid #EBD9A8;border-radius:9px;padding:9px 13px;font-size:12.5px;color:var(--amber-deep);margin:0 0 10px;line-height:1.5;}

  .kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;}
  .kcard{border:.5px solid var(--line);border-left-width:4px;border-left-style:solid;border-radius:12px;padding:13px 15px;background:var(--card);}
  .kcard .ktop{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .kcard .kl{font-size:12px;color:var(--mute);font-weight:600;}
  .kcard .info{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:11px;font-weight:700;line-height:16px;text-align:center;cursor:pointer;padding:0;font-family:inherit;}
  .kcard .info:hover{color:var(--blue);border-color:var(--blue);}
  .kcard .kv{font-size:29px;font-weight:700;line-height:1;margin:6px 0 5px;letter-spacing:-.01em;}
  .kcard .kh{font-size:11.5px;font-weight:600;color:var(--mute);margin:0 0 7px;}
  /* small colour reminder shown above every table */
  .tlegend{font-size:10.5px;color:var(--mute-2);margin:0 0 7px;line-height:1.5;}
  .tlegend .ld{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 9px;}
  .tlegend .ld:first-child{margin-left:0;}
  .tlegend .ld.green{background:var(--green);} .tlegend .ld.amber{background:var(--amber);} .tlegend .ld.red{background:var(--red);} .tlegend .ld.none{background:var(--mute-2);}
  .kcard.green{border-left-color:var(--green);background:var(--green-tint);} .kcard.green .kv{color:var(--green-deep);}
  .kcard.amber{border-left-color:var(--amber);background:var(--amber-tint);} .kcard.amber .kv{color:var(--amber-deep);}
  .kcard.red{border-left-color:var(--red);background:var(--red-tint);} .kcard.red .kv{color:var(--red-deep);}
  /* no 30-day data: neutral grey, never red — a missing load must not read as "worse" */
  .kcard.none{border-left-color:var(--mute-2);background:#F1F2F4;} .kcard.none .kv{color:var(--ink);}
  .dl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;padding:2px 0;}
  .dl .dk{color:var(--mute);} .dl .dr{white-space:nowrap;} .dl .dv{font-weight:600;} .dl .dn{font-weight:700;margin-left:5px;}
  .flat{color:var(--mute-2);}

  .ctxline{margin:12px 0 2px;font-size:13px;background:var(--card);border:.5px solid var(--line);border-radius:10px;padding:11px 15px;line-height:1.7;}
  .ctxline b{font-weight:700;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 12px;}
  .search{display:flex;align-items:center;gap:7px;background:var(--card);border:.5px solid var(--line);border-radius:9px;padding:0 11px;height:36px;flex:1;min-width:180px;}
  .search input{border:0;outline:0;background:none;flex:1;font-family:inherit;font-size:13.5px;color:var(--ink);min-width:0;}
  .count{font-size:12px;color:var(--mute-2);}
  .tbl-scroll{overflow-x:auto;background:var(--card);border:.5px solid var(--line);border-radius:12px;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  thead th{position:sticky;top:0;background:#F0F2F5;text-align:right;padding:9px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mute);cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line);}
  thead th.l{text-align:left;}
  thead th.sorted::after{content:" \25BE";color:var(--blue);} thead th.asc::after{content:" \25B4";color:var(--blue);}
  tbody td{padding:7px 11px;text-align:right;border-top:.5px solid var(--line-soft);white-space:nowrap;}
  tbody td.l{text-align:left;} tbody tr:hover{background:#F7FAFF;}
  .code{font-weight:700;color:var(--blue-deep);} .nm2{color:var(--mute);}
  .chip{display:inline-block;min-width:30px;padding:2px 7px;border-radius:6px;font-weight:700;font-size:12px;}
  .chip.green{background:var(--green-tint);color:var(--green-text);}
  .chip.amber{background:var(--amber-tint);color:var(--amber-deep);}
  .chip.red{background:var(--red-tint);color:var(--red-text);}
  .chip.none{background:#EEF0F3;color:var(--mute);}
  /* arrows are direction only (neutral ink) — colour lives solely in the 30-day comparison */
  .arrow{font-size:11px;font-weight:700;margin-left:4px;color:var(--mute);} .arrow.flat{color:var(--mute-2);}
  thead th .thd{display:block;font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--mute-2);margin-top:1px;}
  .stalebar{background:var(--amber-tint);border-bottom:.5px solid #EBD9A8;color:var(--amber-deep);font-size:12.5px;line-height:1.5;padding:9px 26px;}
  .stalebar b{font-weight:700;}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#EEF0F3;color:var(--mute);}

  footer{padding:18px 24px 30px;text-align:center;font-size:11.5px;color:var(--mute-2);}
  .overlay{position:fixed;inset:0;background:rgba(20,25,33,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay[hidden]{display:none;}
  .sheet{background:var(--paper);max-width:560px;width:100%;max-height:86vh;border-radius:14px;display:flex;flex-direction:column;}
  .sheet h3{margin:0;padding:16px 20px;border-bottom:.5px solid var(--line);font-size:15px;}
  .sheetbody{overflow:auto;padding:6px 20px 22px;}
  .gitem{padding:11px 0;border-bottom:.5px solid var(--line-soft);} .gitem b{font-size:13.5px;} .gitem p{margin:4px 0 0;font-size:12.5px;color:var(--mute);line-height:1.5;}
  .iclose{float:right;border:0;background:#EEF0F3;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--mute);font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow">Account Manager &middot; Daily Report</div><h1>Portfolio stock health</h1><div class="meta" id="meta">—</div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
      <img id="brandLogo" alt="" style="height:30px;width:auto;background:#fff;padding:4px 9px;border-radius:7px;display:none;">
      <button class="ibtn" id="glossaryBtn" type="button">How it's calculated</button>
    </div>
  </header>
  <div class="stalebar" id="stale" hidden></div>
  <div class="tabs" id="tabs"></div>
  <div class="filterbar" id="filterbar">
    <span id="filterSlots" style="display:contents"></span>
    <button class="clear" id="fClear" type="button">Clear filters</button>
    <span class="lens" id="lens"></span>
  </div>
  <div class="pane active" id="pane"></div>
  <footer id="footer">—</footer>
</div>
<div class="overlay" id="glossary" hidden>
  <div class="sheet"><h3>How these are calculated <button class="iclose" id="glossaryClose" type="button">&#10005;</button></h3>
  <div class="sheetbody" id="glossaryBody"></div></div>
</div>
<div class="overlay" id="cardInfo" hidden>
  <div class="sheet"><h3><span id="cardInfoTitle">—</span><button class="iclose" id="cardInfoClose" type="button">&#10005;</button></h3>
  <div class="sheetbody" id="cardInfoBody"></div></div>
</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function(){
  var D; try{ D=JSON.parse(document.getElementById('payload').textContent); }catch(e){ document.getElementById('pane').innerHTML='<p>Could not load data.</p>'; return; }
  var meta=D.meta||{}, KSC=D.KSC||[], KPS=D.KPS||[], SITES=D.sites||[], CLIENT_N=D.clients||[], PROD=D.products||[], SC=D.sc||[], PS=D.ps||[], PORT=D.port||{c:[],p:[],w:[]};
  var CLIENT_MODE=meta.client||'';   // single-client report: payload pre-filtered to one client
  // Channel branding (SAMS): swap the header logo + brand-prefix the eyebrow. Absent/pnp keeps the PNP look.
  var CHANNEL=(function(){var c=String(meta.channel||'').toLowerCase();return (c==='makro'||c==='massbuild'||c==='game')?c:'pnp';})();
  var BRANDS={makro:{name:'Makro',logo:'makro-logo.png'},massbuild:{name:'Massbuild',logo:'massbuild-logo.jpg'},game:{name:'Game',logo:'game-logo.png'}};
  function objSC(a){ a=a||[]; var o={}; for(var i=0;i<KSC.length;i++) o[KSC[i]]=a[i]||0; return o; }
  function objPS(a){ a=a||[]; var o={}; for(var i=0;i<KPS.length;i++) o[KPS[i]]=a[i]||0; return o; }

  var KPIS=[['oos','Out of stock'],['low','Low Stock Cover'],['phantom','Phantom'],['neg','Negative SOH'],['disc','Discontinued with SOH']];
  var KLAB={oos:'Out of stock',low:'Low Stock Cover',phantom:'Phantom',neg:'Negative SOH',disc:'Discontinued with SOH'};
  var TABS=[{id:'overview',t:'Overview'},{id:'clients',t:'By Client'},{id:'sites',t:'By Site'},{id:'products',t:'By Product'},{id:'siteproduct',t:'Site × Product'},
            {id:'k_oos',t:'Out of stock',k:'oos'},{id:'k_low',t:'Low Stock Cover',k:'low'},{id:'k_phantom',t:'Phantom',k:'phantom'},{id:'k_neg',t:'Negative SOH',k:'neg'},{id:'k_disc',t:'Discontinued with SOH',k:'disc'}];
  // Single client: no By-Client tab, and no Site × Product tab. Drop the TAB only — paneSiteProduct and its
  // dispatch branch in render() stay for the portfolio, and filteredPS() also feeds By Product. The dispatch's
  // final else is paneProducts(), so a surviving tab whose branch was removed would silently render By Product.
  if(CLIENT_MODE) TABS=TABS.filter(function(t){return t.id!=='clients' && t.id!=='siteproduct';});

  function nf(x){ return (x==null?0:Math.round(x)).toLocaleString('en-ZA'); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function el(tag,props){ var e=document.createElement(tag); if(props) for(var k in props){ if(k==='className')e.className=props[k]; else if(k==='textContent')e.textContent=props[k]; else if(k==='type')e.type=props[k]; else e.setAttribute(k,props[k]); } return e; }
  function prettyRep(email){ if(!email) return '—'; var p=String(email).split('@')[0].replace(/[._-]+/g,' ').trim(); return p.replace(/\b\w/g,function(c){return c.toUpperCase();}); }
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function isoParts(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||'')); return m?[+m[1],+m[2],+m[3]]:null; }
  var CUR_Y=(isoParts(meta.current)||[0])[0];
  // The year is added whenever it differs from the headline's — a stale vendor's "7 Oct" would otherwise read as this October.
  function pdate(iso){ if(!iso)return '—'; var p=isoParts(iso); if(!p)return String(iso); return p[2]+' '+(MON[p[1]-1]||'')+(p[0]!==CUR_Y?' '+p[0]:''); }
  function dayNo(p){ return p?Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5):null; }
  // Run date (SAST) from meta.generated. The engine currently stamps it "10 Sep 2026 at 13:00" (DateTime.Now on the SAST
  // server), not ISO, so both shapes parse. Unparseable or absent -> null, and the headline says "Latest": we never
  // print "Yesterday" without proof, because a late feed (T-2) under that word misleads a rep.
  function runParts(g){ g=String(g||''); var p=isoParts(g); if(p) return p;
    var m=/^(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\s+(\d{4})/.exec(g); if(!m) return null;
    var mi=MON.indexOf(m[2].charAt(0).toUpperCase()+m[2].slice(1).toLowerCase()); return mi<0?null:[+m[3],mi+1,+m[1]]; }
  // D1 label rule — AmEmailBuilder computes the same thing for the email header; the two must agree or the email and
  // the report it links to name the same day differently. "Yesterday" only when latest data == run date − 1 day.
  var IS_YEST=(function(){ var c=dayNo(isoParts(meta.current)), r=dayNo(runParts(meta.generated)); return c!=null&&r!=null&&r-c===1; })();
  var HEAD_LAB=IS_YEST?'Yesterday':'Latest', PREV_LAB=IS_YEST?'Day before yesterday':'Day before';
  // An absent period arrives as an empty meta date (old engine: no day30ago at all). Its values are MISSING, shown
  // as "—" — never 0, because a missed feed day printed as 0 reads as a clean shelf.
  var HASP=!!meta.previous, HASW=!!meta.weekago, HAS30=!!meta.day30ago;
  // D2 colour rule, against 30 days ago ONLY. Twin: AmEmailBuilder.Trend — change one, change both, or the email and
  // the report colour the same number differently. Exact equality on the displayed integer, no tolerance band.
  // 0 is always green (0 vs 0 too, else every clean line goes yellow); no 30-day data is grey, never red.
  function colr(c,m){ c=Math.round(c||0); if(c===0) return 'green'; if(m==null) return 'none'; m=Math.round(m); return c<m?'green':c>m?'red':'amber'; }
  // direction only, neutral ink: the baseline differs per row (day before / last week / 30 days), so a colour here
  // would contradict the card colour, which is set by the 30-day point alone.
  function arrow(c,b){ if(b==null) return ''; var d=Math.round(c)-Math.round(b); if(d===0) return '<span class="arrow flat">—</span>'; return '<span class="arrow">'+(d<0?'▼':'▲')+nf(Math.abs(d))+'</span>'; }
  function pk(o,key){ return o?(o[key]||0):null; }   // period value; null = that period is missing

  var state={tab:'overview', country:[], sub:[], profile:[], province:[], store:[], rep:[], client:[]};

  // ---------- re-slicing engine: everything derives from the base grains + active filters ----------
  // SITES row = [code, name, profile, province, country, subchannel, rep, lastVisited]. s[5] (sub-channel) is
  // the retail FORMAT from tblSites (CORP / FRANCHISE / HYPER / …), NOT s[2] (Site profile, from the SDC feed);
  // s[6]/s[7] are the rep email + last-visited SAST date from dbo.SentReports (blank if never visited) — PORTFOLIO
  // ONLY: a client payload is published on a public path, so the engine projects its site rows to 6 fields and
  // s[6]/s[7] are undefined there (hence the ||'' below). EVERY filter is MULTI-select: state.X is an array of
  // picked values, empty = all. inSel = no picks OR value picked.
  // Period arrays: sc row = [site, client, cur, prev, wk, mo?]; ps row = [site, product, client, cur, prev, wk, mo?].
  // The trailing 30-day array is appended by the new engine and absent on the old one.
  function inSel(sel,v){ return !sel.length || sel.indexOf(v==null?'':v)>=0; }
  function sPass(s){
    return inSel(state.country,s[4]) && inSel(state.sub,s[5]||'') && inSel(state.profile,s[2])
        && inSel(state.province,s[3]) && inSel(state.store,s[0]) && inSel(state.rep,s[6]||''); }
  function scPass(r){ return sPass(SITES[r[0]]) && inSel(state.client, CLIENT_N[r[1]]); }
  function psPass(r){ return sPass(SITES[r[0]]) && inSel(state.client, CLIENT_N[r[2]]); }
  function filteredSC(){ return SC.filter(scPass); }
  function filteredPS(){ return PS.filter(psPass); }
  function addArr(acc,a){ for(var i=0;i<acc.length;i++) acc[i]+=(a[i]||0); }
  function zero(n){ var z=[]; for(var i=0;i<n;i++) z.push(0); return z; }

  // sum a list of sc rows -> {cur,prev,wk,mo}; a period that is missing for the whole run is null, never zeros.
  // Within a present 30-day period a row without its array is a GENUINE zero (the proc emits DAY30AGO only when
  // every vendor has its snapshot, so an absent row means the line did not exist then) — hence r[5]||[].
  // .sites is overwritten with the DISTINCT site count on every present period, mo included.
  function sumSC(rows){
    var c=zero(KSC.length),p=zero(KSC.length),w=zero(KSC.length),m=zero(KSC.length),seen={},n=0;
    for(var i=0;i<rows.length;i++){ var r=rows[i]; addArr(c,r[2]); addArr(p,r[3]||[]); addArr(w,r[4]||[]); addArr(m,r[5]||[]); if(!seen[r[0]]){seen[r[0]]=1;n++;} }
    var O={cur:objSC(c),prev:HASP?objSC(p):null,wk:HASW?objSC(w):null,mo:HAS30?objSC(m):null};
    [O.cur,O.prev,O.wk,O.mo].forEach(function(o){ if(o) o.sites=n; }); return O;
  }
  function rollupClients(rows){
    var by={}; rows.forEach(function(r){ (by[r[1]]=by[r[1]]||[]).push(r); });

  function buildOneFilter(f){

    var pop=el('div',{className:'ms-pop'}), listWrap=el('div');
    // Uniform across every filter: a search box (narrows the list) + a Select all / Clear row, then the checkboxes.
    var si=el('input',{className:'msearch',type:'search',placeholder:'Filter '+f.label.toLowerCase()+'…'});
    si.addEventListener('input',function(){ var q=si.value.toLowerCase(); listWrap.querySelectorAll('label').forEach(function(l){ l.style.display=(l.getAttribute('data-lab')||'').toLowerCase().indexOf(q)>=0?'':'none'; }); });
    pop.appendChild(si);

    // Select all obeys the current search text (only the visible options); Clear drops just this filter's picks.

    aClr.addEventListener('click',function(){ state[f.key]=[]; listWrap.querySelectorAll('input[type=checkbox]').forEach(function(cb){ cb.checked=false; }); onFilterChange(f); });
    acts.appendChild(aAll); acts.appendChild(aClr); pop.appendChild(acts);
    opts.forEach(function(o){ var lab=el('label'); lab.setAttribute('data-lab',o[1]);
      var cb=el('input',{type:'checkbox'}); cb.value=o[0]; cb.checked=state[f.key].indexOf(o[0])>=0;
      cb.addEventListener('change',function(){ var sel=state[f.key],i=sel.indexOf(o[0]); if(cb.checked){ if(i<0) sel.push(o[0]); } else if(i>=0) sel.splice(i,1); onFilterChange(f); });

  }
  function paneClients(){ var el=document.createElement('div'); el.appendChild(elH2('Clients','('+CX.clients.length+')')); el.appendChild(table(CX.clients.slice(),namedCols('Client account'),{sort:colIndex(namedCols('Client account'),'OOS'),search:'Search client',searchKeys:['name']})); return el; }
  function paneSites(){ var el=document.createElement('div'); el.appendChild(elH2('Sites','('+CX.sites.length+')')); el.appendChild(table(CX.sites.slice(),siteCols(),{sort:colIndex(siteCols(),'OOS'),search:'Search site code or name',searchKeys:['code','name']})); return el; }
  function paneProducts(){ var el=document.createElement('div'); el.appendChild(elH2('Products','('+CX.products.length+' flagged)')); el.appendChild(table(CX.products.slice(),productCols(),{sort:colIndex(productCols(),'OOS'),search:'Search article or description',searchKeys:['code','name']})); return el; }
  // every flagged site × article line (the PRODUCTSITE grain). Built lazily — only when this tab is open.
  function spCols(){ return [
    {label:'Site',l:true,get:function(e){return '<span class="code">'+esc(e.code)+'</span>';},sort:function(e){return e.code;}},
    {label:'Store name',l:true,get:function(e){return esc(e.name||'—');},sort:function(e){return e.name||'';}},
    {label:'Province',l:true,get:function(e){return '<span class="nm2">'+esc(e.province||'—')+'</span>';},sort:function(e){return e.province||'';}},
    {label:'Profile',l:true,get:function(e){return '<span class="pill">'+esc(e.profile)+'</span>';},sort:function(e){return e.profile;}},
    {label:'Article',l:true,get:function(e){return '<span class="code">'+esc(e.article)+'</span>';},sort:function(e){return e.article;}},
    {label:'Description',l:true,get:function(e){return esc(e.desc);},sort:function(e){return e.desc;}}
  ].concat(KPICOLS); }
  var SP_LIMIT=2000;  // cap painted rows on the full report; search/filters reach the rest
  function paneSiteProduct(){
    var rows=filteredPS().map(function(r){ var s=SITES[r[0]],pr=PROD[r[1]]; return {code:s[0],name:s[1],profile:s[2],province:s[3],article:pr[0],desc:pr[1],
      cur:objPS(r[3]),prev:HASP?objPS(r[4]):null,wk:HASW?objPS(r[5]):null,mo:HAS30?objPS(r[6]):null}; });
    var el=document.createElement('div');
    el.appendChild(elH2('Site × Product','('+nf(rows.length)+' flagged lines)'));
    var note=document.createElement('div'); note.className='note';
    note.innerHTML='Every flagged site-article line in scope. '+(rows.length>SP_LIMIT?'Showing '+nf(SP_LIMIT)+' of them, out-of-stock lines first — <b>narrow with the filters above or the search</b> to see the rest.':'')+' Use the filters above and the column sort to drill in.';
    el.appendChild(note);
    el.appendChild(table(rows,spCols(),{sort:colIndex(spCols(),'OOS'),limit:SP_LIMIT,search:'Search site code, name or article',searchKeys:['code','name','article','desc']}));
    return el;
  }
  // Sorts here go by the headline column's LABEL through colIndex, never a literal index: the column count moves
  // (Last visited is portfolio-only), and a stale index sorts silently by whatever column now sits there.
  function paneKpi(key){
    var el=document.createElement('div');
    el.innerHTML='<div class="h2">'+esc(KLAB[key])+' <span class="sub">'+esc(CX.label)+'</span></div><div class="kcards">'+cardHTML(CX.agg,key,KLAB[key])+'</div>';
    var sc=[{label:'Site',l:true,get:function(e){return '<span class="code">'+esc(e.code)+'</span>';},sort:function(e){return e.code;}},
            {label:'Store name',l:true,get:function(e){return esc(e.name||'—');},sort:function(e){return e.name||'';}},
            // the second copy of Last visited (siteCols has the other) — portfolio only, see siteCols
            CLIENT_MODE?null:{label:'Last visited',l:true,get:function(e){return e.last?pdate(e.last):'—';},sort:function(e){return e.last||'';}},
            {label:'Province',l:true,get:function(e){return '<span class="nm2">'+esc(e.province||'—')+'</span>';},sort:function(e){return e.province||'';}},
            {label:'Profile',l:true,get:function(e){return '<span class="pill">'+esc(e.profile)+'</span>';},sort:function(e){return e.profile;}}
           ].filter(Boolean).concat(periodCols(key));
    el.appendChild(elH2('Most affected sites','for '+KLAB[key]));
    el.appendChild(table(CX.sites.slice(),sc,{sort:colIndex(sc,HEAD_LAB),limit:50}));
    var pc=[{label:'Article',l:true,get:function(e){return '<span class="code">'+esc(e.code)+'</span>';},sort:function(e){return e.code;}},
            {label:'Description',l:true,get:function(e){return esc(e.name);},sort:function(e){return e.name;}},
            {label:'Sites',get:function(e){return nf(e.cur.sites);},sort:function(e){return e.cur.sites;}}].concat(periodCols(key));
    el.appendChild(elH2('Most affected products','for '+KLAB[key]));
    el.appendChild(table(CX.products.slice(),pc,{sort:colIndex(pc,HEAD_LAB),limit:50}));
    return el;
  }

  function render(){
    CX=context();
    var tb=TABS.filter(function(x){return x.id===state.tab;})[0]||TABS[0];
    var node = tb.k?paneKpi(tb.k):(tb.id==='overview'?paneOverview():tb.id==='clients'?paneClients():tb.id==='sites'?paneSites():tb.id==='siteproduct'?paneSiteProduct():paneProducts());
    var pane=document.getElementById('pane'); pane.innerHTML=''; pane.appendChild(node);
    document.getElementById('lens').textContent=CX.label;
  }

  document.getElementById('tabs').addEventListener('click',function(e){var t=e.target.closest('.tab');if(!t)return;state.tab=t.getAttribute('data-tab');document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===t);});render();});
  document.getElementById('fClear').addEventListener('click',function(){ state.country=(hasSA?['South Africa']:[]); state.sub=[];state.profile=[];state.province=[];state.store=[];state.rep=[];state.client=[]; buildFilters(); render(); });

  // Entries that are null are skipped: a client report never mentions reps (its payload carries none — D5), and the
  // excluded-vendors entry appears only when the bar at the top does.
  document.getElementById('glossaryBody').innerHTML=[
    ['Colours (lower is better)','Each KPI is a count of problems, so fewer is better. The colour compares the headline number with the same KPI <b>30 days earlier</b>: green = fewer, yellow = exactly the same, red = more. A 0 is always green, even when it was also 0 thirty days ago. Grey = there is no data for 30 days ago, so no comparison is made (it is never shown as red). The same rule colours the cards and every KPI number in the tables.'],
    ['Arrows','▼ fewer / ▲ more than the period on that row, with the difference. They show the direction only and are not coloured — the colour comes from the 30-day comparison alone.'],
    ['Periods','The headline is the latest data date, labelled <b>Yesterday</b> when it is the day before this report was generated and <b>Latest</b> otherwise (for example when the day’s feed has not landed yet). It is compared with the day before (−1 day), the same day last week (−7) and 30 days ago (−30), and every point shows its actual date. A period with no data shows “—”, not 0.'+(CHANNEL==='pnp'?' Each vendor is read on its own latest date and counted back from there.':'')+' Data updates daily. On the KPI tabs the four periods sit side by side, oldest first.'],
    ['Out of stock','Active line (status 04) with on-hand at or below 0.'],
    ['Low Stock Cover','Active line, days cover ≤ 14 and still selling — about to run out.'],
    ['Phantom','Active line with stock but no sale in 60+ days — likely not on the shelf.'],
    ['Negative SOH','On-hand below 0 — impossible figure; the shelf is counted so the system can be corrected.'],
    ['Discontinued with SOH','Non-active line still holding stock — clear or return it.'],
    ['Active lines &amp; base','Active lines are site-article lines on status 04. The base is every site-article combination in scope — all statuses, the full range. Both are shown on the line under the cards for context and re-compute as you filter.'],
    ['Most affected','The “Most affected” tables are ranked by out of stock, most first. Click any column heading to re-sort.'],
    ['Filters',esc(FILTER_NAMES.join(', '))+' re-slice everything live — the cards and every table. Each filter is multi-select — tick several.'+(hasSA?' Country defaults to South Africa;':'')+' the Province list follows the chosen countries.'],
    ['Tabs',esc(TABS.map(function(t){return t.t;}).join(', '))+'. Each KPI tab lists the most affected sites and products for that KPI, with the colour on the headline column only.'],
    CLIENT_MODE?null:['Rep &amp; Last visited','Taken from the store reports ARIA has sent (each store gets its report on its visit day), so “last visited” ≈ the date of the most recent store report and the rep is whoever received it. Blank for a store ARIA has never sent a report for.'],
    ['Flagged products','The product list is built from article × site lines that have at least one problem, so it is the problem list — healthy lines are not shown.'],
    STALE.length?['Excluded vendors','A vendor whose latest data is more than 7 days older than the newest vendor’s is left out of every figure and every period, rather than being counted as current. Each one is named in the bar at the top with its vendor number and last data date.']:null
  ].filter(Boolean).map(function(g){return '<div class="gitem"><b>'+g[0]+'</b><p>'+g[1]+'</p></div>';}).join('');
  document.getElementById('glossaryBtn').addEventListener('click',function(){document.getElementById('glossary').hidden=false;});
  document.getElementById('glossaryClose').addEventListener('click',function(){document.getElementById('glossary').hidden=true;});
  document.getElementById('glossary').addEventListener('click',function(e){if(e.target.id==='glossary')e.target.hidden=true;});

  // ---------- per-card info button ----------
  var KINFO={
    oos:'<b>What it counts.</b> Active lines (status 04) where on-hand is 0 or below — the shelf is empty but the line is still expected to sell. <b>The big number</b> is how many site-article lines are out of stock on the headline date. <b>Act:</b> get stock back on the shelf / raise an order.',
    low:'<b>What it counts.</b> Active lines with 14 days of cover or less that are still selling — about to run out. <b>Act:</b> replenish before they hit zero.',
    phantom:'<b>What it counts.</b> Active lines that show stock on the system but have not sold in 60+ days — usually the stock is not really on the shelf (lost, misplaced or miscounted). <b>Act:</b> physically check the shelf and correct the on-hand.',
    neg:'<b>What it counts.</b> Lines with on-hand below 0 — an impossible figure, so a system or count error. <b>Act:</b> count the shelf so the figure can be corrected.',
    disc:'<b>What it counts.</b> Lines that are no longer active (discontinued) but still holding stock — capital tied up in dead range. <b>Act:</b> clear or return it.'
  };
  document.getElementById('pane').addEventListener('click',function(e){
    var b=e.target.closest('.info'); if(!b) return;
    var k=b.getAttribute('data-k');
    document.getElementById('cardInfoTitle').textContent=KLAB[k]||'KPI';
    document.getElementById('cardInfoBody').innerHTML='<div class="gitem"><p>'+(KINFO[k]||'')+'</p></div>'+
      '<div class="gitem"><b>Reading the colours</b><p>The left bar &amp; background compare the big number with <b>30 days ago</b> — green = fewer (or 0), yellow = exactly the same, red = more, grey = no data for 30 days ago. The arrows on the rows below show only which way the count moved against that row’s date, so a card can be green (fewer than a month ago) while showing ▲ against the day before.</p></div>';
    document.getElementById('cardInfo').hidden=false;
  });
  document.getElementById('cardInfoClose').addEventListener('click',function(){document.getElementById('cardInfo').hidden=true;});
  document.getElementById('cardInfo').addEventListener('click',function(e){if(e.target.id==='cardInfo')e.target.hidden=true;});

  render();
})();
</script>
